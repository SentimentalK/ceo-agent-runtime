# Sign on to CIBC Online Banking in the persistent "cibc" Chrome profile.
# Credentials come from Infisical at run time. The AI never sees them.
# First run: use --keep-open. If CIBC asks for a 2FA code, type it in the browser window.
name: cibc.login
profile: cibc
secrets:
  provider: infisical
  project_id: a59a14bf-3e6d-4f80-98b2-accea5cc268f   # lifeos-sensitive
  env: prod
  path: /automation/cibc
steps:
  - goto: https://www.cibconline.cibc.com/ebm-resources/public/banking/cibc/client/web/index.html#/signon
  - click: {target: 'role=button[name="Accept all cookies"]', optional: true, timeout: 5}
  # Already signed on from a previous run? Then stop here.
  - wait_for: {any: ['role=textbox[name="Card number"]', 'role=heading[name=/my accounts/i]'], timeout: 30}
  - wait_for: {target: 'role=textbox[name="Card number"]', timeout: 5}
  - fill: {target: 'role=textbox[name="Card number"]', value: "${secret:CIBC_CARD_NUMBER}", secret: true}
  - click: role=button[name="Continue"]
  - wait_for: {target: 'role=textbox[name=/password/i]', timeout: 30}
  - snapshot: password-page
  - fill: {target: 'role=textbox[name=/password/i]', value: "${secret:CIBC_PASSWORD}", secret: true}
  - click: role=button[name=/sign on/i]
  # Next page is one of: 2FA code, a digital offer interstitial, or the Home page.
  - wait_for:
      any:
        - 'role=textbox[name=/verification code/i]'
        - 'role=button[name="Accept now"]'
        - 'role=heading[name="Credit Cards"]'
      timeout: 60
  - snapshot: after-sign-on
  # 2FA: no code source is set up yet. The user types the code in the window. 300 s.
  - wait_for:
      if_visible: 'role=textbox[name=/verification code/i]'
      any:
        - 'role=button[name="Accept now"]'
        - 'role=heading[name="Credit Cards"]'
      timeout: 300
  # Skip any offer interstitial without answering it: go to the Home page directly.
  - goto: https://www.cibconline.cibc.com/ebm-resources/online-banking/accounts/client/index.html#/?channel=web
  - wait_for: {target: 'role=heading[name="Credit Cards"]', timeout: 60}
  - assert: {title: Home}
  - screenshot: signed-on
